<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadows & Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Background Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="110" x2="1200" y2="110" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="170" x2="1200" y2="170" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="230" x2="1200" y2="230" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="290" x2="1200" y2="290" stroke="#94a3b8" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="350" stroke="#94a3b8" stroke-width="1" />
    <line x1="400" y1="0" x2="400" y2="350" stroke="#94a3b8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="350" stroke="#94a3b8" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="350" stroke="#94a3b8" stroke-width="1" />
    <line x1="1000" y1="0" x2="1000" y2="350" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Computer Vision Elements (Background layer - Pulsing bounding box & scan lines) -->
  <!-- Floating Bounding Box 1 -->
  <g transform="translate(820, 50)" opacity="0.85">
    <rect x="0" y="0" width="280" height="220" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
    </rect>
    <!-- Corner Anchors -->
    <path d="M -2 20 L -2 -2 L 20 -2" stroke="#38bdf8" stroke-width="4" fill="none" />
    <path d="M 260 -2 L 282 -2 L 282 20" stroke="#38bdf8" stroke-width="4" fill="none" />
    <path d="M 282 200 L 282 222 L 260 222" stroke="#38bdf8" stroke-width="4" fill="none" />
    <path d="M 20 222 L -2 222 L -2 200" stroke="#38bdf8" stroke-width="4" fill="none" />
    <!-- Object Tag -->
    <rect x="-2" y="-32" width="140" height="28" rx="6" fill="#0284c7" />
    <text x="10" y="-13" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">YOLO26: Object 99.4%</text>
    
    <!-- Scanning Radar Line inside box -->
    <line x1="10" y1="10" x2="270" y2="10" stroke="#38bdf8" stroke-width="2" opacity="0.7">
      <animate attributeName="y1" values="10;210;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="10;210;10" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Floating Bounding Box 2 (Left Background) -->
  <g transform="translate(70, 180)" opacity="0.5">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="none" stroke="#a855f7" stroke-width="2" />
    <rect x="0" y="-24" width="110" height="22" rx="4" fill="#7e22ce" />
    <text x="8" y="-9" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SAM 2: Segment</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Guaranteed Unobscured) -->
  <g transform="translate(80, 115)" filter="url(#shadow)">
    <!-- Top Badge -->
    <g transform="translate(0, -50)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#accentGrad)" opacity="0.9" />
      <text x="15" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">ULTIMATE VISUAL AI RESOURCE HUB</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Visual AI &amp; Computer Vision
    </text>

    <!-- Subtitle -->
    <text x="0" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Curated Ecosystem of Commercial SaaS Platforms &amp; Open-Source Deep Learning Frameworks
    </text>

    <!-- Tech Feature Pills (Foreground Below Subtitle) -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🎯 Object Detection</text>

      <rect x="172" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="188" y="21" fill="#a855f7" font-family="system-ui, sans-serif" font-size="13" font-weight="600">✂️ SAM 2 Segmentation</text>

      <rect x="364" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="380" y="21" fill="#ec4899" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔤 Vision OCR</text>

      <rect x="516" y="0" width="190" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="532" y="21" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">👁️ Foundation Models</text>
    </g>
  </g>
</svg>
