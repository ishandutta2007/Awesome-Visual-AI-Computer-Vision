    <path d="M 20 222 L -2 222 L -2 200" stroke="#38bdf8" stroke-width="4" fill="none" />
    <rect x="-2" y="-32" width="140" height="28" rx="6" fill="#0284c7" />
    <text x="10" y="-13" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">YOLO26: Object 99.4%</text>
    <line x1="10" y1="10" x2="270" y2="10" stroke="#38bdf8" stroke-width="2" opacity="0.7">
      <animate attributeName="y1" values="10;210;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="10;210;10" dur="4s" repeatCount="indefinite" />
