    <text x="0" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Curated Ecosystem of SaaS Platforms &amp; Open-Source Deep Learning Frameworks</text>
    <g transform="translate(0, 95)">
